{% extends "base.html" %}
{% set active_page = "login" %}
{% block title %}凭重置码改密 · 守夜广场{% endblock %}

{% block content %}
<div class="auth-card card panel-anim mt-32">
    <h2 class="text-center mb-8">凭重置码修改密码 🔑</h2>
    <p class="text-muted text-center mb-24" style="font-size:var(--fs-12)">
        忘记密码请联系任意管理员获取重置码，码 <b>15 分钟内</b>有效、<b>仅可使用一次</b>
    </p>
    <form id="rp-form">
        <div class="field">
            <label class="field__label" for="rp-username">用户名</label>
            <input class="input" id="rp-username" type="text" autocomplete="username"
                   placeholder="你的登录用户名" required>
        </div>
        <div class="field">
            <label class="field__label" for="rp-code">重置码</label>
            <input class="input" id="rp-code" type="text" maxlength="8"
                   placeholder="管理员给你的 8 位码" autocomplete="off" required
                   style="letter-spacing:4px;text-transform:uppercase">
        </div>
        <div class="field">
            <label class="field__label" for="rp-new">新密码</label>
            <input class="input" id="rp-new" type="password" autocomplete="new-password"
                   placeholder="≥8 位，同时含字母与数字" required>
            <div class="pwd-strength" id="rp-strength" aria-live="polite"></div>
        </div>
        <div class="field">
            <label class="field__label" for="rp-new2">确认新密码</label>
            <input class="input" id="rp-new2" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn--primary btn--block btn--lg mt-8" id="rp-submit" type="submit">
            确认修改</button>
    </form>
    <p class="text-faint text-center mt-16" style="font-size:var(--fs-12)">
        改密成功后所有设备的登录状态都会失效，需用新密码重新登录 ·
        <a href="/login">返回登录</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/reset_password.js?v={{ static_v }}"></script>
{% endblock %}
